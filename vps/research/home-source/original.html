// === توابع تبدیل تقویم شمسی <-> میلادی (الگوریتم ریاضی استاندارد، بدون کتابخانه خارجی) ===
function div(a, b) { return Math.trunc(a / b); }
function jalaliToGregorianParts(jy, jm, jd) {
  let gy;
  const jy1 = jy + 1595;
  let days = -355668 + (365 * jy1) + (div(jy1, 33) * 8) + div(((jy1 % 33) + 3), 4) + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  gy = 400 * div(days, 146097);
  days %= 146097;
  if (days > 36524) {
    gy += 100 * div(--days, 36524);
    days %= 36524;
    if (days >= 365) days++;
  }
  gy += 4 * div(days, 1461);
  days %= 1461;
  if (days > 365) {
    gy += div(days - 1, 365);
    days = (days - 1) % 365;
  }
  let gd = days + 1;
  const isLeap = ((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0));
  const monthDays = [31, isLeap?29:28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm = 0;
  while (gm < 12 && gd > monthDays[gm]) { gd -= monthDays[gm]; gm++; }
  return { year: gy, month: gm + 1, day: gd };
}
function gregorianToJalaliPartsExact(gy, gm, gd) {
  const gDaysInMonth = [31, ((gy%4===0&&gy%100!==0)||(gy%400===0))?29:28, 31,30,31,30,31,31,30,31,30,31];
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = 355666 + (365 * gy) + div((gy2 + 399), 400) - div((gy2 + 99), 100) + div(gy2, 4) + gd + (gm>0?gDaysInMonth.slice(0,gm-1).reduce((a,b)=>a+b,0):0);
  let jy = -1595 + (33 * div(days, 12053));
  days %= 12053;
  jy += 4 * div(days, 1461);
  days %= 1461;
  if (days > 365) { jy += div(days - 1, 365); days = (days - 1) % 365; }
  let jm, jd;
  if (days < 186) { jm = 1 + div(days, 31); jd = 1 + (days % 31); }
  else { jm = 7 + div(days - 186, 30); jd = 1 + ((days - 186) % 30); }
  return { year: jy, month: jm, day: jd };
}
function gregorianToJalaliParts(gregorianDateStr) {
  if (!gregorianDateStr) return null;
  const [gy, gm, gd] = gregorianDateStr.split('-').map(Number);
  if (!gy || !gm || !gd) return null;
  return gregorianToJalaliPartsExact(gy, gm, gd);
}
function jalaliPartsToGregorian(jy, jm, jd) {
  const g = jalaliToGregorianParts(jy, jm, jd);
  const pad = (n) => String(n).padStart(2,'0');
  return `${g.year}-${pad(g.month)}-${pad(g.day)}`;
}
function formatJalaliDisplay(gregorianDateStr) {
  const p = gregorianToJalaliParts(gregorianDateStr);
  if (!p) return '';
  const pad = (n) => String(n).padStart(2,'0');
  return `${p.year}/${pad(p.month)}/${pad(p.day)}`;
}

function transformCacheToNewsData(cacheData) {
  if (!cacheData || !cacheData.articles) return {};
  const result = {};
  cacheData.articles.forEach(article => {
    const agencyId = article.agencyId || 'reuters';
    if (!result[agencyId]) result[agencyId] = [];
    result[agencyId].push({
      id: article.id || `${agencyId}-${Date.now()}`,
      title: article.title_fa || article.title || '',
      title_en: article.title || '',
      lead: article.lead || '',
      sourceUrl: article.sourceUrl || '#',
      time: article.time || '',
      category: article.category || 'politics',
      region: article.region || 'global',
      newsValues: article.newsValues || {},
      sentiment: article.sentiment || {positive:33,neutral:34,negative:33},
    });
  });
  return result;
}

// === کامپوننت نمودار خطی ساده با SVG خام (بدون نیاز به کتابخانه خارجی) ===
function PriceLineChart({ points, unit, isRTL }) {
  if (!points || points.length === 0) return null;

  const W = 600, H = 220, PAD = 36;
  const values = points.map(p => p.close);
  const minV = Math.min(...values);
  const maxV = Math.max(...values);
  const range = maxV - minV || 1;

  const xStep = (W - PAD*2) / Math.max(1, points.length - 1);
  const coords = points.map((p, i) => {
    const x = PAD + i * xStep;
    const y = H - PAD - ((p.close - minV) / range) * (H - PAD*2);
    return { x, y, ...p };
  });

  const pathD = coords.map((c,i) => (i===0?'M':'L') + c.x.toFixed(1) + ',' + c.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${coords[coords.length-1].x.toFixed(1)},${H-PAD} L${coords[0].x.toFixed(1)},${H-PAD} Z`;

  const firstVal = points[0].close;
  const lastVal = points[points.length-1].close;
  const isUpOverall = lastVal >= firstVal;
  const lineColor = isUpOverall ? '#10b981' : '#ef4444';

  const fmtNum = (n) => new Intl.NumberFormat(isRTL?'fa-IR':'en-US').format(Math.round(n));

  // نمایش حداکثر ۶ برچسب تاریخ روی محور افقی تا شلوغ نشود
  const labelStep = Math.max(1, Math.ceil(points.length / 6));

  return (
    <div>
      <div className="flex justify-between text-[11px] text-slate-400 mb-2">
        <span>{isRTL?'کمترین: ':'Min: '}<span className="text-slate-200 font-bold">{fmtNum(minV)} {unit}</span></span>
        <span>{isRTL?'بیشترین: ':'Max: '}<span className="text-slate-200 font-bold">{fmtNum(maxV)} {unit}</span></span>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{height:'220px'}}>
        <defs>
          <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={lineColor} stopOpacity="0.25"/>
            <stop offset="100%" stopColor={lineColor} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {/* خطوط راهنمای افقی */}
        {[0,0.25,0.5,0.75,1].map((t,i)=>(
          <line key={i} x1={PAD} x2={W-PAD} y1={H-PAD-t*(H-PAD*2)} y2={H-PAD-t*(H-PAD*2)} stroke="#334155" strokeWidth="0.5" strokeDasharray="2,3"/>
        ))}
        <path d={areaD} fill="url(#chartGradient)" stroke="none"/>
        <path d={pathD} fill="none" stroke={lineColor} strokeWidth="2"/>
        {coords.map((c,i) => (
          <circle key={i} cx={c.x} cy={c.y} r="2.5" fill={lineColor}/>
        ))}
        {coords.map((c,i) => (
          i % labelStep === 0 && (
            <text key={i} x={c.x} y={H-8} fontSize="8" fill="#64748b" textAnchor="middle">
              {isRTL ? c.date_jalali.split('/').slice(1).join('/') : c.date_gregorian.split('/').slice(1).join('/')}
            </text>
          )
        ))}
      </svg>
    </div>
  );
}

// === کامپوننت ورودی تاریخ شمسی (مقدار داخلی میلادی YYYY-MM-DD برای سازگاری با API) ===
function JalaliDateInput({ value, onChange, placeholder, className }) {
  const [open, setOpen] = useState(false);
  const parts = value ? gregorianToJalaliParts(value) : null;
  const today = gregorianToJalaliPartsExact(new Date().getFullYear(), new Date().getMonth()+1, new Date().getDate());
  const [tempYear, setTempYear] = useState(parts?.year || today.year);
  const [tempMonth, setTempMonth] = useState(parts?.month || today.month);
  const [tempDay, setTempDay] = useState(parts?.day || today.day);

  const years = [];
  for (let y = today.year; y >= today.year - 5; y--) years.push(y);
  const daysInJalaliMonth = (m) => m <= 6 ? 31 : (m <= 11 ? 30 : 29);

  const applySelection = () => {
    const g = jalaliPartsToGregorian(tempYear, tempMonth, tempDay);
    onChange(g);
    setOpen(false);
  };

  return (
    <div className="relative">
      <button type="button" onClick={()=>setOpen(!open)}
        className={className || "bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-300 outline-none text-right"}>
        {value ? formatJalaliDisplay(value) : (placeholder || 'انتخاب تاریخ')}
      </button>
      {open && (
        <div className="absolute z-50 mt-1 bg-slate-800 border border-slate-600 rounded-lg p-3 shadow-xl flex gap-2" style={{minWidth:'220px'}}>
          <select value={tempDay} onChange={e=>setTempDay(parseInt(e.target.value))} className="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-[11px] text-slate-200">
            {Array.from({length: daysInJalaliMonth(tempMonth)}, (_,i)=>i+1).map(d=><option key={d} value={d}>{d}</option>)}
          </select>
          <select value={tempMonth} onChange={e=>setTempMonth(parseInt(e.target.value))} className="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-[11px] text-slate-200">
            {JALALI_MONTH_NAMES.map((name,i)=><option key={i} value={i+1}>{name}</option>)}
          </select>
          <select value={tempYear} onChange={e=>setTempYear(parseInt(e.target.value))} className="bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-[11px] text-slate-200">
            {years.map(y=><option key={y} value={y}>{y}</option>)}
          </select>
          <button type="button" onClick={applySelection} className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold text-[11px] px-2 py-1 rounded">✓</button>
        </div>
      )}
    </div>
  );
}

    setArchiveAgency(null);

  // مرحله ۱: از نمایه سبک، لیست (تاریخ + خبرگزاری) های مطابق فیلتر را پیدا می‌کنیم
  // مرحله ۲: برای هر (تاریخ، خبرگزاری) یکتا، فایل کامل آن روز را می‌خوانیم و ترکیب می‌کنیم
  const loadToolkitArchiveData = async () => {
    setToolkitArchiveLoading(true);
    try {
      const params = new URLSearchParams();
      if (toolkitArchiveAgency !== 'all') params.set('agencyId', toolkitArchiveAgency);
      if (toolkitArchiveDateFrom) params.set('dateFrom', toolkitArchiveDateFrom);
      if (toolkitArchiveDateTo) params.set('dateTo', toolkitArchiveDateTo);
      params.set('limit', '2000');
      const res = await fetch(ARCHIVE_SEARCH_URL + '?' + params.toString());
      const data = await res.json();
      const indexEntries = data.results || [];

      // یکتاسازی جفت‌های (تاریخ، خبرگزاری) برای کمینه‌کردن تعداد درخواست‌ها
      const pairs = new Map();

          const dayRes = await fetch(ARCHIVE_SEARCH_URL + '?' + new URLSearchParams({action:'day', date, agencyId}));

      }
      setToolkitArchiveArticles(allArts);

      setToolkitArchiveArticles([]);
    } finally {
      setToolkitArchiveLoading(false);

      try {

      {name:'دیپلماسی اقتصادی', re:/تحریم|تجارت|گمرک|صادرات|نفت/gi},

      {name:'بازارهای مالی',     re:/بورس|سهام|ارزی|نقدینگی/gi},
    ];
    const kw = topics.map(tp => ({name:tp.name, w:(pool.match(tp.re)||[]).length}))

  const toolkitArticles = useMemo(() => {

  // === نرمال‌سازی متن فارسی: یکسان‌سازی حروف عربی/فارسی که از نظر بصری یکسان ولی از نظر یونیکد متفاوتند ===
  // مثلا "ي" عربی (U+064A) باید با "ی" فارسی (U+06CC) یکی در نظر گرفته شود تا جستجو درست کار کند
  const normalizePersian = (s) => (s || '')
    .replace(/\u064A/g, '\u06CC') // ي عربی -> ی فارسی
    .replace(/\u0643/g, '\u06A9') // ك عربی -> ک فارسی
    .replace(/\u0629/g, '\u0647'); // ة عربی -> ه فارسی

  const [wordFreqListOpen, setWordFreqListOpen] = useState(false);

  const wordFreqStats = useMemo(() => {
    if (!appliedResearchKeyword) return null;
    let total = 0; const agencyCounts = {}; const matchedArticles = [];
    let re;
    try {
      re = new RegExp(normalizePersian(appliedResearchKeyword).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');

    toolkitArticles.forEach(a => {

      const c = (normalizePersian(a.title).match(re)||[]).length + (normalizePersian(a.title_fa).match(re)||[]).length + (normalizePersian(a.lead).match(re)||[]).length;
      if(c>0){total+=c;agencyCounts[a.agency.id]=(agencyCounts[a.agency.id]||0)+c;matchedArticles.push(a);}
    });
    return {total,agencyCounts,matchedArticles};

  useEffect(() => { setWordFreqListOpen(false); }, [appliedResearchKeyword]);

  const calculatedAnalysis = useMemo(() => {
    const s = {total:0, byCategory:{politics:0,economy:0,technology:0,tech:0,environment:0,culture:0,military:0,diplomacy:0,society:0,energy:0}, lexicalDiversity:{}};
    const byAgency = {};
    toolkitArticles.forEach(a => {
      const agId = a.agency?.id || a.agencyId || 'unknown';
      (byAgency[agId] = byAgency[agId] || []).push(a);
    });
    Object.entries(byAgency).forEach(([agId, arts]) => {
      let tw=0; const uw=new Set();
      arts.forEach(a => {
        s.total++;
        if(s.byCategory[a.category]!==undefined) s.byCategory[a.category]++;
        const words=(a.title+' '+(a.lead||'')).toLowerCase().split(/\s+/).filter(w=>w.length>2);
        words.forEach(w=>{tw++;uw.add(w);});
      });
      s.lexicalDiversity[agId]=Math.round(tw>0?(uw.size/tw)*100:50);
    });
    return s;
  }, [toolkitArticles]);

  // گروه‌بندی toolkitArticles بر اساس خبرگزاری - برای تب‌های framing و diversity (هم در حالت زنده، هم آرشیو)
  const toolkitByAgency = useMemo(() => {
    const grouped = {};
    toolkitArticles.forEach(a => {
      const agId = a.agency?.id || a.agencyId || 'unknown';
      (grouped[agId] = grouped[agId] || []).push(a);
    });
    return grouped;
  }, [toolkitArticles]);

  const getFilteredData = (agencyId) => {
    let list = newsData[agencyId] || [];
    if(selectedTrend) list=list.filter(i=>i.title.includes(selectedTrend)||i.lead.includes(selectedTrend));
    if(selectedCategory!=='all') list=list.filter(i=>i.category===selectedCategory);
    if(selectedRegion!=='all') list=list.filter(i=>i.region===selectedRegion);
    if(filterQuery) list=list.filter(i=>i.title.toLowerCase().includes(filterQuery.toLowerCase())||i.lead.toLowerCase().includes(filterQuery.toLowerCase()));
    return list;
  };

  const handleDragStart=(e,id)=>{setDraggedId(id);e.dataTransfer.effectAllowed='move';};
  const handleDragOver=(e,targetId)=>{
    e.preventDefault();if(draggedId===targetId)return;
    const di=agencyOrder.indexOf(draggedId),ti=agencyOrder.indexOf(targetId);
    const o=[...agencyOrder];o.splice(di,1);o.splice(ti,0,draggedId);setAgencyOrder(o);
  };
  const handleDragEnd=()=>setDraggedId(null);

  const toggleAgency = (agencyId) => {
    setDisabledAgencies(prev => {
      const next = new Set(prev);
      if (next.has(agencyId)) next.delete(agencyId);
      else next.add(agencyId);
      return next;
    });
  };

  // لیست خبرگزاری‌های قابل‌نمایش، مشترک بین رندر کارت‌ها و منطق دکمه شناور موبایل
  const visibleAgencyIds = useMemo(() => agencyOrder.filter(id=>!disabledAgencies.has(id)), [agencyOrder, disabledAgencies]);

  // === دکمه شناور «خبرگزاری بعدی» فقط روی موبایل: تشخیص کارت فعلی در دید، نمایش/پنهان‌سازی هوشمند ===
  const [floatingNextAgency, setFloatingNextAgency] = useState(null); // null یعنی دکمه نباید نمایش داده شود
  useEffect(() => {
    const handleScroll = () => {
      if (visibleAgencyIds.length === 0) { setFloatingNextAgency(null); return; }
      const cardsSectionEl = document.getElementById('news-cards-section');
      if (!cardsSectionEl) { setFloatingNextAgency(null); return; }
      const sectionRect = cardsSectionEl.getBoundingClientRect();
      // قبل از رسیدن به بخش کارت‌ها، دکمه نمایش داده نشود
      if (sectionRect.top > window.innerHeight * 0.5) { setFloatingNextAgency(null); return; }
      // پیدا کردن کارتی که الان بیشترین همپوشانی با viewport را دارد
      let currentIdx = -1;
      for (let i = 0; i < visibleAgencyIds.length; i++) {
        const el = document.getElementById(`agency-card-${visibleAgencyIds[i]}`);
        if (!el) continue;
        const rect = el.getBoundingClientRect();
        if (rect.top <= window.innerHeight * 0.4 && rect.bottom >= window.innerHeight * 0.1) {
          currentIdx = i;
        }
      }
      if (currentIdx === -1 || currentIdx >= visibleAgencyIds.length - 1) {
        setFloatingNextAgency(null); // به آخرین کارت رسیده‌ایم یا هنوز به هیچ کارتی نرسیده‌ایم
      } else {
        setFloatingNextAgency(visibleAgencyIds[currentIdx + 1]);
      }
    };
    window.addEventListener('scroll', handleScroll, { passive: true });
    handleScroll();
    return () => window.removeEventListener('scroll', handleScroll);
  }, [visibleAgencyIds]);

  const currentCityData = cityWeatherData || {
    weather: {temp:'--', cond_fa:'در حال بارگذاری', cond_en:'Loading'},
    prayer_times: {fajr:'--:--', dhuhr:'--:--', maghrib:'--:--'},
  };
  const cityDisplayName = isRTL
    ? (CITIES_LIST[activeCity]?.name_fa || activeCity)
    : (CITIES_LIST[activeCity]?.name_en || activeCity);
  const hasData = Object.keys(newsData).length > 0;

  return (
    <div className={`min-h-screen bg-slate-950 text-slate-100 font-sans flex flex-col pb-20 ${isRTL?'rtl':'ltr'}`} style={{fontFamily: isRTL ? 'Tahoma,Arial,sans-serif' : 'Inter,sans-serif'}}>

      {/* === هدر یکپارچه: شامل همه بخش‌های ثابت بالای صفحه، با یک sticky واحد === */}
      <header className="sticky top-0 z-50 bg-slate-900">
        {/* نوار بالا: ساعت، تاریخ، آب‌وهوا، اوقات شرعی */}
        <div className="border-b border-slate-800 text-[10px] md:text-xs text-slate-400 py-2 px-4 flex flex-wrap justify-between items-center gap-2">
          <div className="flex gap-3 items-center flex-wrap">
            <span className="font-semibold text-amber-500">⏰ {currentTime.toLocaleTimeString(isRTL?'fa-IR':'en-US',{hour12:false})}</span>
            <span>📅 {shamsiDate}</span>
            <span className="text-slate-500">|</span>
            <span>{gregorianDate}</span>
            <span className="text-slate-500">|</span>
            <span>{hijriDate}</span>
            <div className="bg-slate-950/60 rounded px-2 py-0.5 border border-slate-800 flex gap-2 text-[9px] items-center">
              <span className="text-slate-500">{t.shariaTimes}</span>
              <span className="text-amber-500 font-bold">{cityDisplayName}</span>
              <span>🌡 {currentCityData.weather.temp} - {isRTL?currentCityData.weather.cond_fa:currentCityData.weather.cond_en}</span>
              <span>{t.fajr}: {currentCityData.prayer_times.fajr}</span>
              <span>{t.dhuhr}: {currentCityData.prayer_times.dhuhr}</span>
              <span>{t.maghrib}: {currentCityData.prayer_times.maghrib}</span>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <select value={activeCity} onChange={e=>setActiveCity(e.target.value)} className="bg-slate-800 border border-slate-700 text-[10px] text-slate-300 rounded px-2 py-0.5 focus:outline-none">
              {Object.entries(CITIES_LIST).map(([k,v])=><option key={k} value={k}>{isRTL?v.name_fa:v.name_en}</option>)}
            </select>
          </div>
        </div>

        {/* نوار مناسبت روز - فقط اگر مناسبتی برای امروز ثبت شده باشد */}
        {todayEvent && (
          <div className="border-b border-slate-800 px-4 py-1.5 text-[10px] text-amber-400 flex gap-1 items-center font-bold">
            <span className="text-slate-400">{t.eventsLabel}</span>
            <span className="font-black">{isRTL?todayEvent.title_fa:todayEvent.title_en}</span>
            {todayEvent.holiday && <span className="bg-emerald-500/15 text-emerald-400 text-[9px] px-1.5 py-0.5 rounded">({isRTL?'تعطیل رسمی':'Official holiday'})</span>}
          </div>
        )}

        {/* نام سایت، عنوان، جستجو */}
        <div className="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md">
          <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col lg:flex-row items-center justify-between gap-4">
            <div className="flex items-center gap-3 w-full lg:w-auto">
              <div className="p-2.5 bg-gradient-to-tr from-amber-500 to-orange-600 rounded-lg shadow-lg shadow-orange-500/20 shrink-0">
                <span className="text-slate-950 font-black text-lg">🌐</span>
              </div>
              <div>
                <h1 className="text-lg md:text-xl font-black tracking-wide bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">{t.title}</h1>
                <p className="text-xs text-slate-500 font-bold mt-0.5">{t.subtitle}</p>
              </div>
            </div>
            <div className="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-end">
              {/* انتخاب زبان - فعلاً غیرفعال است، برای توسعه‌های بعدی نگه داشته شده
              <div className="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-1">
                {['fa','en','fr','es','ar'].map(l=>(
                  <button key={l} onClick={()=>setLang(l)} className={`px-2 py-1 text-[11px] rounded font-bold transition-all ${lang===l?'bg-amber-500 text-slate-950':'text-slate-400 hover:text-white'}`}>{l.toUpperCase()}</button>
                ))}
              </div>
              */}
              {/* جستجو */}
              <input type="text" placeholder={t.searchPlaceholder} value={filterQuery} onChange={e=>setFilterQuery(e.target.value)}
                className="w-40 bg-slate-950 border border-slate-800 focus:border-amber-500/50 rounded-lg py-1.5 px-3 text-xs text-slate-200 placeholder-slate-500 outline-none" />
            </div>
          </div>
        </div>

        {/* اخبار فوری */}
        <div className="py-2">
          <div className="max-w-7xl mx-auto px-4 flex items-center gap-4 overflow-hidden">
            <div className="flex items-center gap-1.5 bg-red-600/10 border border-red-500/20 text-red-400 px-2.5 py-0.5 rounded text-[10px] font-extrabold uppercase tracking-wider animate-pulse shrink-0">
              <span className="w-1.5 h-1.5 rounded-full bg-red-500 inline-block"></span>
              <span className="hidden sm:inline">{t.breakingNews}</span>
              <span className="sm:hidden">{isRTL?'فوری':'LIVE'}</span>
            </div>
            {allArticles.length>0 && allArticles[tickerIndex] && (
              <div className="text-xs font-medium text-slate-300 truncate flex items-center gap-2">
                <span className={`px-1.5 py-0.5 rounded text-[9px] font-semibold text-white bg-gradient-to-r ${allArticles[tickerIndex].agency.color}`}>
                  {isRTL?allArticles[tickerIndex].agency.name_fa:allArticles[tickerIndex].agency.name_en}
                </span>
                <span className="cursor-pointer hover:text-amber-400 transition-colors" onClick={()=>setSelectedNews(allArticles[tickerIndex])}>
                  {allArticles[tickerIndex].title}
                </span>
              </div>
            )}
          </div>
        </div>
      </header>

      {/* فیلترها - با محتوای صفحه اسکرول می‌شود، ثابت نیست */}
      <section className="bg-slate-900/40 border-b border-slate-800/60 py-3">
        <div className="max-w-7xl mx-auto px-4 space-y-2">
          {/* ترندها */}
          <div className="flex flex-wrap items-center gap-2">
            <span className="text-xs font-black text-amber-500">📈 {t.hotTrends}</span>
            {dynamicKeywords.length===0?<span className="text-xs text-slate-500">{t.noTrends}</span>:
              dynamicKeywords.map(k=>(
                <button key={k} onClick={()=>setSelectedTrend(p=>p===k?null:k)}
                  className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold border transition-all ${selectedTrend===k?'bg-amber-500 text-slate-950 border-amber-500':'bg-slate-800 text-slate-300 border-slate-700 hover:border-amber-500/50'}`}>
                  #{k}
                </button>
              ))
            }
          </div>
          {/* فیلتر موضوعی و منطقه */}
          <div className="flex flex-wrap gap-4">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-[11px] text-slate-400 font-bold">{t.thematicFilter}</span>
              {THEMATIC_FILTERS.map(f=>(
                <span key={f.id} className="inline-flex items-center gap-0.5">
                  <button onClick={()=>setSelectedCategory(f.id)}
                    className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all ${selectedCategory===f.id?'bg-indigo-500 text-white':'bg-slate-800 text-slate-400 hover:text-white'}`}>
                    {isRTL?f.name_fa:f.name_en}
                  </button>
                  {f.id!=='all' && (
                    <a href={`/api/category.php?cat=${encodeURIComponent(f.id)}`} target="_blank" rel="noopener"
                      title={isRTL?'صفحه اختصاصی این دسته‌بندی':'Dedicated category page'}
                      className="text-slate-600 hover:text-amber-400 text-[9px]">🔗</a>
                  )}
                </span>
              ))}
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-[11px] text-slate-400 font-bold">{t.regionalFilter}</span>
              {REGIONAL_FILTERS.map(f=>(
                <button key={f.id} onClick={()=>setSelectedRegion(f.id)}
                  className={`px-2 py-0.5 rounded text-[10px] font-bold transition-all ${selectedRegion===f.id?'bg-teal-500 text-white':'bg-slate-800 text-slate-400 hover:text-white'}`}>
                  {isRTL?f.name_fa:f.name_en}
                </button>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* وضعیت لود */}
      {isLoading && !hasData && (
        <div className="flex items-center justify-center py-20 text-slate-400">
          <span className="animate-spin mr-2">🔄</span> {t.loadingCache}
        </div>
      )}
      {errorMsg && <div className="text-center py-4 text-amber-400 text-sm">{errorMsg}</div>}
      {!isLoading && !hasData && !errorMsg && (
        <div className="text-center py-20 text-slate-500">{t.noData}</div>
      )}

      {/* جدول اخبار */}
      {hasData && (
        <section id="news-cards-section" className="max-w-7xl mx-auto w-full px-2 md:px-4 py-4">
          <div className="flex items-center justify-between mb-3">
            <h2 className="text-sm font-black text-slate-300">📡 {t.monitoringTable}</h2>
            <span className="text-[10px] text-slate-500">{t.lastSync} {lastUpdated}</span>
          </div>

          {/* نوار فعال/غیرفعال‌سازی خبرگزاری‌ها */}
          <div className="flex flex-wrap gap-1.5 mb-3 p-2 bg-slate-900/50 border border-slate-800 rounded-lg">
            <span className="text-[10px] text-slate-500 font-bold self-center ml-1">{isRTL?'نمایش خبرگزاری‌ها:':'Show agencies:'}</span>
            {agencyOrder.map(agencyId => {
              const meta = AGENCY_META[agencyId] || {name_fa:agencyId, name_en:agencyId};
              const isOn = !disabledAgencies.has(agencyId);
              return (
                <button key={agencyId} onClick={()=>toggleAgency(agencyId)}
                  className={`px-2 py-0.5 rounded text-[10px] font-bold border transition-all ${isOn?'bg-amber-500/15 border-amber-500/40 text-amber-300':'bg-slate-800/50 border-slate-700 text-slate-500'}`}>
                  {isOn?'✓':'○'} {isRTL?meta.name_fa:meta.name_en}
                </button>
              );
            })}
          </div>

          {/* چیدمان ستونی عمودی - ارتفاع هر کارت ثابت است، اسکرول داخلی دارد */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
            {(() => {
              return visibleAgencyIds.map((agencyId, idx) => {
              const meta = AGENCY_META[agencyId] || {id:agencyId,name_fa:agencyId,name_en:agencyId,color:'from-slate-600 to-slate-800',textColor:'text-slate-400',badgeBg:'bg-slate-500/10 text-slate-400',logo:agencyId.slice(0,2).toUpperCase()};
              const filtered = getFilteredData(agencyId);
              return (
                <div key={agencyId} id={`agency-card-${agencyId}`} draggable onDragStart={e=>handleDragStart(e,agencyId)} onDragOver={e=>handleDragOver(e,agencyId)} onDragEnd={handleDragEnd}
                  className={`bg-slate-900 border border-slate-800 rounded-xl flex flex-col overflow-hidden transition-all cursor-grab ${draggedId===agencyId?'opacity-50 scale-95':''}`}
                  style={{height:'540px'}}>
                  {/* هدر ستون */}
                  <div className={`p-3 bg-gradient-to-r ${meta.color} flex items-center gap-2 shrink-0`}>
                    <span className="w-7 h-7 flex items-center justify-center bg-slate-950/40 text-white font-black text-xs rounded">{meta.logo}</span>
                    <div>
                      <div className="font-bold text-white text-xs">{isRTL?meta.name_fa:meta.name_en}</div>
                      <div className="text-[9px] text-white/60">{filtered.length} خبر</div>
                    </div>
                    <button onClick={(e)=>{e.stopPropagation();openAgencyArchive(agencyId, meta);}}
                      title={isRTL?'آرشیو این خبرگزاری':'Archive of this agency'}
                      className="mr-auto text-[8px] font-black text-white/90 bg-slate-950/40 hover:bg-slate-950/60 px-1.5 py-0.5 rounded transition-colors">
                      🗄 {isRTL?'آرشیو':'Archive'}
                    </button>
                    <span className="text-[8px] font-black text-white/80 bg-red-500/30 px-1.5 py-0.5 rounded animate-pulse">{t.liveBadge}</span>
                  </div>
                  {/* لیست اخبار - ارتفاع کارت ثابت است، این بخش خودش اسکرول می‌خورد */}
                  <div className="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-2">
                    {filtered.length===0?
                      <p className="text-[11px] text-slate-600 text-center mt-8">{t.noArticles}</p>:
                      filtered.map(article=>(
                        <div key={article.id} onClick={()=>setSelectedNews({...article,agency:meta})}
                          className="bg-slate-800/60 hover:bg-slate-800 border border-slate-700 hover:border-slate-600 rounded-lg p-2.5 cursor-pointer transition-all group">
                          <div className="flex items-center gap-1.5 mb-1.5 flex-wrap">
                            <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${meta.badgeBg}`}>
                              {THEMATIC_FILTERS.find(f=>f.id===article.category)?.[isRTL?'name_fa':'name_en']||article.category}
                            </span>
                            <span className="text-[9px] text-slate-500">{article.time}</span>
                          </div>
                          <h4 className="text-[11px] font-bold text-slate-200 group-hover:text-amber-400 transition-colors leading-relaxed">
                            {lang==='en'?article.title_en||article.title:article.title}
                          </h4>
                          {article.lead && <p className="text-[10px] text-slate-500 mt-1 leading-relaxed line-clamp-2">{article.lead}</p>}
                          {/* sentiment */}
                          {article.sentiment && (
                            <div className="mt-1.5 h-1 rounded-full bg-slate-900 overflow-hidden flex">
                              <div style={{width:`${article.sentiment.positive}%`}} className="bg-emerald-500 h-full"></div>
                              <div style={{width:`${article.sentiment.neutral}%`}} className="bg-slate-500 h-full"></div>
                              <div style={{width:`${article.sentiment.negative}%`}} className="bg-red-500 h-full"></div>
                            </div>

                        </div>

              );
              });
            })()}
          </div>
        </section>
      )}

      {/* جعبه ابزار تحقیقاتی */}
      {hasData && (
        <section className="max-w-7xl mx-auto w-full px-2 md:px-4 py-4">
          <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
            <div className="p-4 border-b border-slate-800 flex items-center gap-3">
              <span className="text-lg">🔬</span>
              <div className="flex-1">
                <h3 className="font-black text-sm text-slate-200">{t.toolkitTitle}</h3>
                <p className="text-xs text-slate-500">{t.toolkitDesc}</p>

                className="px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 font-bold text-[11px] rounded-lg flex items-center gap-1.5 shrink-0">

            {/* انتخاب منبع داده تحلیل: زنده یا آرشیو با فیلتر خبرگزاری/تاریخ */}

          <span className="text-[9px] font-black text-amber-500 shrink-0 uppercase tracking-widest flex items-center gap-1 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded group relative">
            📈 {isRTL?'بازار':'Market'}
            <span className="cursor-help text-slate-400">ⓘ</span>
            <span className="hidden group-hover:block absolute bottom-full mb-2 right-0 w-56 bg-slate-800 border border-slate-600 rounded-lg p-2 text-[9px] font-normal normal-case text-slate-300 shadow-xl z-50">
              {isRTL
                ? 'این قیمت‌ها صرفاً جهت اطلاع کلی هستند و آخرین نرخ ثبت‌شده در بازار را نشان می‌دهند؛ نباید مبنای معامله یا خرید و فروش قرار گیرند.'
                : 'These prices are for general information only and reflect the last recorded market rate; they should not be used as a basis for transactions.'}
            </span>
          </span>
          <div className="flex-1 overflow-hidden" dir="ltr">
            <div className="animate-marquee whitespace-nowrap flex gap-8">
              {[...marketData,...marketData].map((item,idx)=>(
                <div key={idx} onClick={()=>openPriceChart(item)} dir={isRTL?'rtl':'ltr'}
                  className="flex items-center gap-2 text-xs shrink-0 font-extrabold cursor-pointer hover:opacity-75 transition-opacity">
                  <span className="text-slate-400">{isRTL?item.name_fa:item.name_en}:</span>
                  <span className="text-slate-200">{item.price} <span className="text-[9px] text-slate-500">{item.unit}</span></span>
                  <span className={`text-[10px] px-1 rounded ${item.isUp?'bg-emerald-500/10 text-emerald-400':'bg-red-500/10 text-red-400'}`}>{item.change}</span>
                  <span className="text-[9px] text-slate-600">📊</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* مودال نمودار قیمت */}
      {chartModalOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm" onClick={()=>setChartModalOpen(false)}>
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[85vh]" onClick={e=>e.stopPropagation()}>
            <div className="p-4 bg-gradient-to-r from-slate-800 to-slate-900 border-b border-slate-700 flex justify-between items-center">
              <h3 className="font-bold text-white text-sm">📊 {chartLabel}</h3>
              <button onClick={()=>setChartModalOpen(false)} className="text-white hover:bg-white/10 p-1.5 rounded">✕</button>
            </div>

            <div className="p-3 border-b border-slate-800 flex gap-2">
              {[
                {id:'week', label_fa:'هفته', label_en:'Week'},
                {id:'month', label_fa:'ماه', label_en:'Month'},
                {id:'year', label_fa:'سال', label_en:'Year'},
              ].map(r=>(
                <button key={r.id} onClick={()=>{setChartRange(r.id); fetchChartHistory(chartKey, r.id);}}
                  className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-all ${chartRange===r.id?'bg-amber-500 text-slate-950':'bg-slate-800 text-slate-400 hover:text-slate-200'}`}>
                  {isRTL?r.label_fa:r.label_en}
                </button>
              ))}
            </div>

            <div className="p-4 flex-1 overflow-y-auto custom-scrollbar">
              {chartLoading ? (
                <div className="text-center py-16 text-slate-400 text-xs">⏳ {isRTL?'در حال بارگذاری...':'Loading...'}</div>
              ) : chartPoints.length === 0 ? (
                <div className="text-center py-16 text-slate-500 text-xs">{isRTL?'داده‌ای موجود نیست':'No data available'}</div>
              ) : (
                <PriceLineChart points={chartPoints} unit={chartUnit} isRTL={isRTL}/>
              )}
            </div>

            <div className="p-3 border-t border-slate-800 bg-slate-950/50">
              <p className="text-[10px] text-slate-500 text-center">
                {isRTL
                  ? 'داده‌ها بر اساس آخرین نرخ ثبت‌شده روزانه بازار؛ صرفاً جهت اطلاع کلی، نه مرجع معامله.'
                  : 'Based on last recorded daily market rate; for general information only, not a transaction reference.'}
              </p>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
