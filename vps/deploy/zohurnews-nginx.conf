# Install under /etc/nginx/conf.d/ after nginx -t. DNS cutover is separate.
limit_req_zone $binary_remote_addr zone=zohur_api:10m rate=5r/s;
server {
    listen 80;
    listen [::]:80;
    server_name zohurnews.com www.zohurnews.com;
    client_max_body_size 1m;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location /api/ {
        limit_req zone=zohur_api burst=15 nodelay;
        proxy_pass http://127.0.0.1:18086;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
       # Keep page shells and assets available while research queries run.
    location = / {
        root /opt/zohurnews/releases/research-v3/research/web;
        try_files /home.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
    }
    location = /research.html {
        root /opt/zohurnews/releases/research-v3/research/web;
        try_files /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
    }
    location ~ ^/(?:home\.(?:js|css)|app\.mjs|analytics\.mjs|styles\.css|public\.(?:mjs|css))$ {
        root /opt/zohurnews/releases/research-v3/research/web;
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
    }

 location / {
        proxy_pass http://127.0.0.1:18086;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
