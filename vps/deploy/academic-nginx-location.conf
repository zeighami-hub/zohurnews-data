# Add inside the existing ZohurNews HTTPS server block. Keep the same backend.
# Academic PDF exports have a 45s renderer timeout, so allow 60s upstream.
location /api/academic/ {
    limit_req zone=zohur_api burst=15 nodelay;
    proxy_pass http://127.0.0.1:18086;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
