name: Fetch and Analyze News

on:
  # فعلاً به‌عنوان پشتیبان نگه داشته می‌شود؛ طبق مستندات گیت‌هاب ممکن است در بار زیاد تأخیر بخورد.
  # در مرحله ۴ یک تریگر خارجی (cron-job.org) اضافه می‌شود که workflow_dispatch را دقیق صدا می‌زند.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# اجازه‌ی نوشتن در همین ریپو لازم است چون آرشیو و کش‌سازی اینجا کامیت می‌شوند
permissions:
  contents: write

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install xml2js @upstash/redis @octokit/rest

      - name: Run fetch + analyze
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node fetch-and-analyze.js
